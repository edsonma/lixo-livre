<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lixo Livre</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="map"></div>
<header id="topbar">
  <div class="brand-row">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 38s13-11.4 13-21A13 13 0 0 0 7 17c0 9.6 13 21 13 21z" fill="#1b7f3b"/><circle cx="20" cy="17" r="8.5" fill="#fff"/><path d="M15.5 13.5h9M18 12h4M16.2 14.5l1 8h5.6l1-8z" fill="none" stroke="#1b7f3b" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
      Lixo Livre
    </div>
    <button id="bell" class="bell" type="button" aria-label="Notificações">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
    </button>
  </div>
  <form id="search-form" role="search" autocomplete="off">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Buscar endereço ou bairro" aria-label="Buscar endereço ou bairro" enterkeyhint="search">
    <button id="search-clear" type="button" aria-label="Limpar busca">×</button>
  </form>
  <ul id="results"></ul>
</header>
<div id="demo" class="box">Modo demonstração: dados fictícios</div>
<div id="panel" class="box"><button class="close" id="close" aria-label="Fechar">×</button><h2 id="title"></h2><div id="items"></div></div>
<div id="pin"></div>

<div id="chips" role="group" aria-label="Filtrar por nível de sujeira">
  <button class="chip" data-level="todos" aria-pressed="true" type="button"><span class="dot"></span>Todos</button>
  <button class="chip" data-level="limpo" aria-pressed="false" type="button" style="--c:#2e9e4f"><span class="dot"></span>Limpo</button>
  <button class="chip" data-level="moderado" aria-pressed="false" type="button" style="--c:#f2a900"><span class="dot"></span>Moderado</button>
  <button class="chip" data-level="sujo" aria-pressed="false" type="button" style="--c:#e8452c"><span class="dot"></span>Sujo</button>
  <button class="chip" data-level="muito-sujo" aria-pressed="false" type="button" style="--c:#b3261e"><span class="dot"></span>Muito sujo</button>
</div>

<nav id="nav" aria-label="Navegação">
  <button id="nav-map" class="nav-item on" type="button" aria-current="page">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l9 8h-2.5V20h-5v-6h-3v6h-5v-9.5H3z"/></svg>Mapa</button>
  <button id="nav-explore" class="nav-item" type="button">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Explorar</button>
  <button id="report-btn" class="nav-add" type="button" aria-label="Reportar lixo">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button id="nav-alerts" class="nav-item" type="button">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 1 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>Notificações</button>
  <button id="nav-profile" class="nav-item" type="button">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Perfil</button>
</nav>
<div id="toast" role="status"></div>

<div id="place" class="card" role="dialog" aria-labelledby="place-title">
  <h2 id="place-title">Onde está o lixo?</h2>
  <p class="hint">Arraste o mapa até o pino ficar em cima do local, ou toque no ponto exato.</p>
  <button id="locate" class="ghost" type="button">📍 Usar minha localização</button>
  <div id="coords" class="coords" aria-live="polite"></div>
  <div id="place-error" class="error" role="alert"></div>
  <div class="actions">
    <button id="place-cancel" class="secondary" type="button">Cancelar</button>
    <button id="place-ok" class="primary" type="button">Confirmar local</button>
  </div>
</div>

<div id="camera" role="dialog" aria-label="Registrar local">
  <div class="cam">
    <div class="cam-head">
      <button id="cam-back" class="icon-btn" type="button" aria-label="Voltar e mudar o local">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <h2>Registrar local</h2>
      <span class="icon-btn" aria-hidden="true"></span>
    </div>
    <div id="viewfinder" class="viewfinder">
      <video id="video" autoplay playsinline muted></video>
      <img id="shot" alt="Prévia da foto" style="display:none">
      <div id="cam-fallback" class="cam-fallback"></div>
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <div id="cam-caption" class="caption">Tire uma foto do local<br>onde há lixo</div>
    </div>
    <div id="cam-controls" class="cam-controls">
      <button id="gallery-btn" class="side-btn" type="button" aria-label="Escolher da galeria">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg>
      </button>
      <button id="shutter" class="shutter" type="button" aria-label="Tirar foto"></button>
      <button id="flip" class="side-btn" type="button" aria-label="Trocar de câmera">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.5-4.4M4 5v3.6h3.6"/><path d="M4 13a8 8 0 0 0 14.5 4.4M20 19v-3.6h-3.6"/></svg>
      </button>
    </div>
    <div id="cam-tabs" class="cam-tabs">
      <button id="tab-camera" class="on" type="button">Câmera</button>
      <button id="tab-gallery" type="button">Galeria</button>
    </div>
    <div id="cam-review" class="cam-review">
      <button id="retake" class="secondary" type="button">Tirar outra</button>
      <button id="send" class="primary" type="button" disabled>Enviar</button>
    </div>
    <div id="cam-error" class="error" role="alert"></div>
  </div>
  <input id="photo-camera" type="file" accept="image/*" capture="environment" hidden>
  <input id="photo" type="file" accept="image/*" hidden>
</div>

<div id="report" class="card" role="dialog" aria-labelledby="report-title">
  <div class="grab"></div>
  <div class="head"><h2 id="report-title">Reportar lixo</h2></div>
  <div id="progress">
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div class="actions">
      <button id="again" class="secondary" type="button" style="display:none">Enviar outra</button>
      <button id="done" class="primary" type="button" style="display:none">Ver no mapa</button>
    </div>
  </div>
  <div id="error" class="error" role="alert"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
