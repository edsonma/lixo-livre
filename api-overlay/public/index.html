<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lixo Livre</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  .box { position: absolute; background: #fff; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.3); padding: 10px 12px; font-size: 13px; }
  #legend { left: 12px; bottom: 28px; }
  #legend .ramp { height: 10px; width: 160px; border-radius: 5px; margin: 6px 0 2px; background: linear-gradient(90deg, #2e9e4f, #f2d43d, #d92b2b); }
  #legend .ends { display: flex; justify-content: space-between; font-size: 11px; color: #555; }
  #demo { top: 12px; left: 12px; background: #fff3cd; color: #7a5b00; display: none; }
  #panel { top: 12px; right: 12px; width: 280px; max-height: calc(100% - 40px); overflow: auto; display: none; }
  #panel h2 { margin: 0 0 8px; font-size: 14px; }
  #panel .close { position: absolute; top: 6px; right: 10px; cursor: pointer; border: 0; background: none; font-size: 18px; }
  .item { border-top: 1px solid #eee; padding: 8px 0; }
  .item img { width: 100%; border-radius: 6px; display: block; margin-bottom: 4px; }
  .muted { color: #666; }
  :root { --green: #1b7f3b; --green-dark: #14642e; --ink: #1d2a22; --muted: #5f6b64; --line: #e3e8e4; }
  .card { z-index: 10; position: absolute; background: #fff; color: var(--ink); border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,.22); font-size: 14px; }
  .card h2 { margin: 0; font-size: 17px; }
  .card .hint { margin: 4px 0 0; color: var(--muted); line-height: 1.4; }
  .card button { font: inherit; cursor: pointer; }
  .card button:disabled { opacity: .5; cursor: default; }
  .card .actions { display: flex; gap: 8px; margin-top: 14px; }
  .card .actions button { flex: 1; padding: 12px; font-size: 15px; font-weight: 600; border: 0; border-radius: 12px; }
  .primary { background: var(--green); color: #fff; }
  .primary:not(:disabled):hover { background: var(--green-dark); }
  .secondary { background: #eef1ee; color: var(--ink); }
  .ghost { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; color: var(--ink); margin-top: 10px; }
  .link { background: none; border: 0; color: var(--green); font-weight: 600; padding: 4px; }
  .fab { z-index: 10; position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); background: var(--green); color: #fff; border: 0; cursor: pointer; font: 600 16px system-ui, sans-serif; padding: 14px 22px; border-radius: 28px; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  .fab:hover { background: var(--green-dark); }
  #pin { position: absolute; left: 50%; top: 50%; width: 0; height: 0; display: none; pointer-events: none; }
  #pin::before { content: "📍"; position: absolute; font-size: 36px; line-height: 1; transform: translate(-50%, -100%); filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  #pin::after { content: ""; position: absolute; width: 10px; height: 4px; margin: -2px 0 0 -5px; border-radius: 50%; background: rgba(0,0,0,.3); }
  .placed-pin { font-size: 36px; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  #place { top: 12px; left: 50%; transform: translateX(-50%); width: min(380px, calc(100% - 24px)); padding: 16px; display: none; }
  #place .coords { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; margin-top: 8px; }
  #report { left: 50%; bottom: 0; transform: translateX(-50%); width: min(460px, 100%); max-height: 85%; overflow: auto; box-sizing: border-box; border-radius: 20px 20px 0 0; padding: 8px 16px 20px; display: none; }
  #report .grab { width: 40px; height: 4px; border-radius: 2px; background: #d5dbd7; margin: 0 auto 10px; }
  #report .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  #report .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #report .tile { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 18px 8px; background: #f6f9f6; border: 1.5px dashed #b9c8bd; border-radius: 14px; color: var(--ink); }
  #report .tile:hover { border-color: var(--green); background: #eef7f0; }
  #report .tile .ico { font-size: 30px; line-height: 1.2; }
  #report .tile small { color: var(--muted); }
  #report .chosen { text-align: right; }
  #report .preview { display: block; width: 100%; height: 200px; object-fit: cover; border-radius: 12px; margin-bottom: 4px; }
  #report .status { font-size: 15px; margin: 10px 0; }
  #report .score { font-size: 34px; font-weight: 700; }
  #report .score small { font-size: 14px; font-weight: 400; color: var(--muted); }
  #report .meter { height: 10px; background: #eee; border-radius: 5px; overflow: hidden; margin: 6px 0 8px; }
  #report .meter > div { height: 100%; }
  .error { color: #b00020; margin-top: 8px; }
  .error:empty { display: none; }
  @media (max-width: 600px) { #legend { bottom: 96px; } }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #ccc; border-top-color: #1b7f3b; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="map"></div>
<div id="demo" class="box">Modo demonstração: dados fictícios</div>
<div id="legend" class="box"><strong>Sujeira</strong><div class="ramp"></div><div class="ends"><span>baixa</span><span>alta</span></div></div>
<div id="panel" class="box"><button class="close" id="close" aria-label="Fechar">×</button><h2 id="title"></h2><div id="items"></div></div>
<div id="pin"></div>
<button id="report-btn" class="fab" type="button">＋ Reportar lixo</button>

<div id="place" class="card" role="dialog" aria-labelledby="place-title">
  <h2 id="place-title">Onde está o lixo?</h2>
  <p class="hint">Arraste o mapa até o pino ficar em cima do local, ou toque no ponto exato.</p>
  <button id="locate" class="ghost" type="button">📍 Usar minha localização</button>
  <div id="coords" class="coords" aria-live="polite"></div>
  <div id="place-error" class="error" role="alert"></div>
  <div class="actions">
    <button id="place-cancel" class="secondary" type="button">Cancelar</button>
    <button id="place-ok" class="primary" type="button">Confirmar local</button>
  </div>
</div>

<div id="report" class="card" role="dialog" aria-labelledby="report-title">
  <div class="grab"></div>
  <div class="head">
    <h2 id="report-title">Reportar lixo</h2>
    <button id="change-place" class="link" type="button">Mudar local</button>
  </div>
  <div id="form">
    <div id="choose" class="tiles">
      <button id="pick-camera" class="tile" type="button"><span class="ico">📷</span><b>Tirar foto</b><small>Abrir a câmera</small></button>
      <button id="pick-gallery" class="tile" type="button"><span class="ico">🖼️</span><b>Galeria</b><small>Escolher uma foto</small></button>
    </div>
    <input id="photo-camera" type="file" accept="image/*" capture="environment" hidden>
    <input id="photo" type="file" accept="image/*" hidden>
    <div id="chosen" class="chosen" style="display:none">
      <img id="preview" class="preview" alt="Prévia da foto">
      <button id="swap" class="link" type="button">Trocar foto</button>
    </div>
    <div class="actions">
      <button id="cancel" class="secondary" type="button">Cancelar</button>
      <button id="send" class="primary" type="button" disabled>Enviar</button>
    </div>
  </div>
  <div id="progress" style="display:none">
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div class="actions">
      <button id="again" class="secondary" type="button" style="display:none">Enviar outra</button>
      <button id="done" class="primary" type="button" style="display:none">Ver no mapa</button>
    </div>
  </div>
  <div id="error" class="error" role="alert"></div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
(async function () {
  // severity is 0-100
  function levelLabel(s) { return s >= 80 ? "Muito grave" : s >= 60 ? "Grave" : s >= 40 ? "Moderada" : s >= 20 ? "Leve" : "Muito leve"; }
  var status = { center: { lat: -15.7942, lng: -47.8825 }, demo_mode: false };
  try { status = await (await fetch("/api/v1/status")).json(); } catch (e) {}

  document.getElementById("demo").style.display = status.demo_mode ? "block" : "none";

  var map = new maplibregl.Map({
    container: "map",
    center: [status.center.lng, status.center.lat],
    zoom: 12,
    style: {
      version: 8,
      sources: { osm: { type: "raster", tileSize: 256, attribution: "© OpenStreetMap contributors",
        tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"] } },
      layers: [{ id: "osm", type: "raster", source: "osm" }]
    }
  });
  map.addControl(new maplibregl.NavigationControl(), "bottom-right");

  var EMPTY = { type: "FeatureCollection", features: [] };

  async function loadHeat() {
    var b = map.getBounds();
    var bbox = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].join(",");
    try {
      var data = await (await fetch("/api/v1/heatmap?bbox=" + bbox)).json();
      map.getSource("heat").setData(data);
    } catch (e) {}
  }

  map.on("load", function () {
    map.addSource("heat", { type: "geojson", data: EMPTY });
    map.addLayer({
      id: "heat", type: "heatmap", source: "heat",
      paint: {
        "heatmap-weight": ["interpolate", ["linear"], ["get", "score"], 0, 0, 100, 1],
        "heatmap-radius": ["interpolate", ["linear"], ["zoom"], 8, 15, 14, 45],
        "heatmap-opacity": 0.8,
        "heatmap-color": ["interpolate", ["linear"], ["heatmap-density"],
          0, "rgba(46,158,79,0)", 0.2, "#2e9e4f", 0.5, "#f2d43d", 1, "#d92b2b"]
      }
    });
    map.on("moveend", loadHeat);
    loadHeat();
  });

  // Meters per pixel at this zoom, times ~40px: clicking selects roughly that area.
  function radiusFor() {
    var lat = map.getCenter().lat * Math.PI / 180;
    var mpp = 156543.03 * Math.cos(lat) / Math.pow(2, map.getZoom());
    return Math.max(10, Math.min(500, Math.round(mpp * 40)));
  }

  function el(tag, text, cls) {
    var n = document.createElement(tag);
    if (text != null) n.textContent = text;
    if (cls) n.className = cls;
    return n;
  }

  map.on("click", async function (e) {
    if (reporting) return;
    var panel = document.getElementById("panel"), items = document.getElementById("items");
    var url = "/api/v1/trashes?lat=" + e.lngLat.lat + "&lng=" + e.lngLat.lng + "&radius=" + radiusFor();
    var list = [];
    try { list = await (await fetch(url)).json(); } catch (err) {}
    items.replaceChildren();
    document.getElementById("title").textContent = list.length ? list.length + " registro(s) aqui" : "Nenhum registro aqui";
    list.forEach(function (t) {
      var item = el("div", null, "item");
      var img = document.createElement("img");
      img.loading = "lazy"; img.alt = "Foto do lixo";
      try { img.src = new URL(t.photo_url, location.href).pathname; } catch (err) {}
      item.appendChild(img);
      item.appendChild(el("div", levelLabel(t.severity) + " (" + t.severity + "/100) · " + new Date(t.taken_at).toLocaleDateString("pt-BR")));
      if (t.trash_types && t.trash_types.length) item.appendChild(el("div", t.trash_types.join(", "), "muted"));
      if (t.extra_info) item.appendChild(el("div", t.extra_info, "muted"));
      item.appendChild(el("div", "Enviado por " + (t.uploader ? t.uploader.name : "Anônimo"), "muted"));
      items.appendChild(item);
    });
    panel.style.display = "block";
  });


  // ---- Report a photo: upload, then poll until the AI has scored it ----
  var memoryToken = null;
  function storedToken() { try { return localStorage.getItem("lixo-device-token"); } catch (e) { return memoryToken; } }
  function saveToken(t) { memoryToken = t; try { localStorage.setItem("lixo-device-token", t); } catch (e) {} }
  async function deviceToken() {
    var t = storedToken();
    if (t) return t;
    var res = await fetch("/api/v1/devices", { method: "POST" });
    if (!res.ok) throw new Error("Não foi possível iniciar o envio.");
    t = (await res.json()).token;
    saveToken(t);
    return t;
  }

  var $ = function (id) { return document.getElementById(id); };
  var previewUrl = null, pollTimer = null, polling = 0;

  function showError(msg) { $("error").textContent = msg || ""; }

  // The flow has three steps: 1. choose the place on the map, 2. choose the photo, 3. watch the AI score it.
  var reporting = false, step = null, placed = null, marker = null, chosen = null;

  function show(id, on, display) { $(id).style.display = on ? (display || "block") : "none"; }
  function placeError(msg) { $("place-error").textContent = msg || ""; }
  function sheetPadding() { return Math.min(340, Math.round(window.innerHeight * 0.42)); }

  function showCoords() {
    var c = placed || map.getCenter();
    $("coords").textContent = c.lat.toFixed(5) + ", " + c.lng.toFixed(5);
  }
  map.on("move", function () { if (step === "place") showCoords(); });

  function dropMarker() {
    if (marker) { marker.remove(); marker = null; }
  }

  // Step 1: the pin stays in the middle of the screen, the map moves under it.
  function goToPlace() {
    step = "place";
    dropMarker();
    show("report", false); show("place", true); show("pin", true); show("report-btn", false);
    placeError(""); showCoords();
    map.easeTo({ padding: { bottom: 0 }, center: placed || map.getCenter(), zoom: Math.max(map.getZoom(), 16), duration: 300 });
  }

  // Step 2: the place is fixed on a marker, the sheet with the photo options opens below it.
  function goToPhoto() {
    step = "photo";
    placed = map.getCenter();
    var pin = document.createElement("div");
    pin.className = "placed-pin"; pin.textContent = "📍";
    marker = new maplibregl.Marker({ element: pin, anchor: "bottom" }).setLngLat(placed).addTo(map);
    show("pin", false); show("place", false); show("report", true);
    map.easeTo({ center: placed, padding: { bottom: sheetPadding() }, duration: 300 });
  }

  function openReport() {
    resetReport();
    reporting = true; placed = null;
    $("panel").style.display = "none";
    goToPlace();
  }
  function closeReport() {
    polling++; clearTimeout(pollTimer);
    reporting = false; step = null; dropMarker();
    show("place", false); show("report", false); show("pin", false); show("report-btn", true);
    map.easeTo({ padding: { bottom: 0 }, duration: 200 });
  }
  function resetReport() {
    polling++; clearTimeout(pollTimer);
    show("form", true); show("progress", false);
    show("change-place", true, "inline-block");
    $("photo").value = ""; $("photo-camera").value = ""; chosen = null;
    $("send").disabled = true; show("chosen", false); show("choose", true, "grid");
    $("again").style.display = "none"; $("done").style.display = "none";
    showError("");
    if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
  }

  $("report-btn").onclick = openReport;
  $("place-ok").onclick = goToPhoto;
  $("place-cancel").onclick = closeReport;
  $("change-place").onclick = goToPlace;
  $("cancel").onclick = closeReport;
  $("again").onclick = openReport;
  $("done").onclick = function () { closeReport(); loadHeat(); };
  $("swap").onclick = function () { resetReport(); };

  $("locate").onclick = function () {
    placeError("");
    if (!navigator.geolocation) return placeError("Seu navegador não oferece localização. Mova o mapa até o local.");
    $("locate").disabled = true;
    navigator.geolocation.getCurrentPosition(function (pos) {
      $("locate").disabled = false;
      map.flyTo({ center: [pos.coords.longitude, pos.coords.latitude], zoom: 17 });
    }, function () {
      $("locate").disabled = false;
      placeError("Não foi possível obter sua localização. Mova o mapa até o local.");
    }, { enableHighAccuracy: true, timeout: 10000 });
  };

  // While choosing the place, a tap on the map moves the pin there instead of opening the info panel.
  map.on("click", function (e) { if (step === "place") map.easeTo({ center: e.lngLat }); });

  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && reporting) closeReport(); });

  // Two inputs feed one choice: the camera (capture) and the gallery (no capture, so phones offer their photo library)
  $("pick-camera").onclick = function () { $("photo-camera").click(); };
  $("pick-gallery").onclick = function () { $("photo").click(); };
  $("photo").onchange = $("photo-camera").onchange = function () {
    var file = this.files[0];
    if (!file) return; // picker cancelled: keep the previous choice
    chosen = file;
    if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
    previewUrl = URL.createObjectURL(file);
    $("preview").src = previewUrl;
    show("choose", false); show("chosen", true);
    $("send").disabled = false;
  };

  function setStatus(spinning, text, severity) {
    var box = $("status");
    box.replaceChildren();
    if (spinning) box.appendChild(el("span", null, "spinner"));
    if (severity != null) {
      var score = el("div", String(severity), "score");
      score.appendChild(el("small", "/100"));
      score.setAttribute("aria-label", severity + " de 100");
      box.appendChild(score);
      var meter = el("div", null, "meter"), fill = document.createElement("div");
      fill.style.width = severity + "%";
      fill.style.background = "hsl(" + Math.round(120 * (1 - severity / 100)) + ", 70%, 45%)";
      meter.appendChild(fill);
      box.appendChild(meter);
    }
    box.appendChild(el("span", text));
  }

  function renderStage(r) {
    if (r.stage === "protecting_photo") return setStatus(true, "Protegendo sua privacidade…");
    if (r.stage === "analyzing") return setStatus(true, "Analisando…");
    if (r.stage === "scored") {
      var text = levelLabel(r.severity);
      if (r.trash_types && r.trash_types.length) text += " · " + r.trash_types.join(", ");
      return setStatus(false, text, r.severity);
    }
    if (r.stage === "not_trash") return setStatus(false, "A IA não encontrou lixo nessa foto. Tente outra mais de perto.");
    return setStatus(false, "Sua foto ficou em revisão. Ela aparece no mapa depois de aprovada.");
  }

  async function poll(id, token, run, tries) {
    if (run !== polling) return; // cancelled or replaced
    var r = null;
    try {
      var res = await fetch("/api/v1/me/trashes/" + id, { headers: { "X-Device-Token": token } });
      if (res.ok) r = await res.json();
    } catch (e) {}
    if (run !== polling) return;
    if (r) {
      renderStage(r);
      if (r.done) { $("again").style.display = "inline-block"; $("done").style.display = "inline-block"; return; }
    }
    if (tries >= 40) {
      setStatus(false, "Ainda processando. Volte em instantes: sua foto já foi enviada.");
      $("again").style.display = "inline-block"; $("done").style.display = "inline-block";
      return;
    }
    pollTimer = setTimeout(function () { poll(id, token, run, tries + 1); }, 1500);
  }

  $("send").onclick = async function () {
    var file = chosen;
    if (!file) return;
    showError(""); $("send").disabled = true;
    try {
      var token = await deviceToken();
      var c = placed || map.getCenter();
      var form = new FormData();
      form.append("photo", file);
      form.append("lat", c.lat); form.append("lng", c.lng);
      // A gallery photo was usually taken earlier: its file date is the best guess (the server also reads the EXIF).
      var taken = file.lastModified && file.lastModified > 946684800000 && file.lastModified <= Date.now() ? new Date(file.lastModified) : new Date();
      form.append("taken_at", taken.toISOString());
      var res = await fetch("/api/v1/trashes", { method: "POST", headers: { "X-Device-Token": token }, body: form });
      var body = await res.json().catch(function () { return {}; });
      if (res.status === 401) { saveToken(""); throw new Error("Sessão expirada. Tente enviar de novo."); }
      if (!res.ok) {
        var msgs = body.errors ? Object.keys(body.errors).map(function (k) { return k + " " + body.errors[k].join(", "); }).join("; ") : "Erro " + res.status;
        throw new Error(msgs);
      }
      $("form").style.display = "none"; $("progress").style.display = "block"; show("change-place", false);
      setStatus(true, "Enviando…");
      var run = ++polling;
      poll(body.id, token, run, 0);
    } catch (e) {
      showError(e.message || "Falha no envio.");
      $("send").disabled = false;
    }
  };

  document.getElementById("close").onclick = function () { document.getElementById("panel").style.display = "none"; };
})();
</script>
</body>
</html>
