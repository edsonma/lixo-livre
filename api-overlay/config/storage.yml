test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

# Local disk. On a host with an ephemeral filesystem (Railway) mount a volume at storage/,
# or files disappear on every deploy.
local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# S3-compatible storage: AWS S3, Cloudflare R2, MinIO, an S3-compatible bucket from your host.
# Select it with ACTIVE_STORAGE_SERVICE=s3. Leave S3_ENDPOINT empty for AWS itself.
s3:
  service: S3
  access_key_id: <%= ENV["S3_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["S3_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("S3_REGION", "auto") %>
  bucket: <%= ENV["S3_BUCKET"] %>
<% if ENV["S3_ENDPOINT"].present? %>
  endpoint: <%= ENV["S3_ENDPOINT"] %>
  force_path_style: <%= ENV.fetch("S3_FORCE_PATH_STYLE", "true") %>
  request_checksum_calculation: when_required
  response_checksum_validation: when_required
<% end %>
